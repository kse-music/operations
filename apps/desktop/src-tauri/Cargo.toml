[package]
name = "serverdeck-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "serverdeck_desktop_lib"
crate-type = ["rlib"]
test = false
doctest = false

[[bin]]
name = "serverdeck-desktop"
path = "src/main.rs"
test = false

[[test]]
name = "ipc"
path = "tests/ipc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.7.2"
serverdeck-core.workspace = true
serverdeck-plugin-core.workspace = true
serverdeck-plugin-runtime.workspace = true
serverdeck-plugin-sdk.workspace = true
serde_json.workspace = true
serverdeck-application.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
serverdeck-windows-file-drag = { path = "../../../crates/windows-file-drag" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
wat = "1"
base64 = "0.22.1"

[lints]
workspace = true
