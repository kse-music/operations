[workspace]
members = ["crates/core", "crates/storage", "crates/security", "crates/ssh", "crates/sftp", "crates/monitor", "crates/ops", "crates/tasks", "crates/ai", "crates/plugin-sdk", "crates/plugin-core", "crates/plugin-runtime", "crates/application", "apps/desktop/src-tauri", "tools/ssh-probe"]
default-members = ["crates/core", "crates/storage", "crates/security", "crates/application", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
tracing = "0.1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive", "serde"] }
serverdeck-core = { path = "crates/core" }
serverdeck-storage = { path = "crates/storage" }
serverdeck-application = { path = "crates/application" }
serverdeck-security = { path = "crates/security" }
serverdeck-ssh = { path = "crates/ssh" }
serverdeck-sftp = { path = "crates/sftp" }
serverdeck-monitor = { path = "crates/monitor" }
serverdeck-ops = { path = "crates/ops" }
serverdeck-tasks = { path = "crates/tasks" }
serverdeck-ai = { path = "crates/ai" }
serverdeck-plugin-core = { path = "crates/plugin-core" }
serverdeck-plugin-runtime = { path = "crates/plugin-runtime" }
serverdeck-plugin-sdk = { path = "crates/plugin-sdk" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
