name: Signed Windows update draft
on:
  workflow_dispatch:
    inputs:
      notes:
        description: User-facing release notes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-update-release
  cancel-in-progress: false
jobs:
  windows-update:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - name: Preserve repository LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Validate stable version and prepare notes
        id: release
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node --input-type=module -e 'import {readAppVersion} from "./tools/app-version.mjs"; import {releaseTag} from "./tools/update-release.mjs"; import {mkdirSync,writeFileSync,appendFileSync} from "node:fs"; const version=readAppVersion(); const tag=releaseTag(version); if (!process.env.RELEASE_NOTES?.trim()) throw new Error("Release notes are required"); mkdirSync(".local/update-release",{recursive:true}); writeFileSync(".local/update-release/notes.txt",process.env.RELEASE_NOTES); appendFileSync(process.env.GITHUB_OUTPUT,"version="+version+"\ntag="+tag+"\n");'
      - run: npm run plugins:build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:build
      - name: Run copied native test executables
        run: |
          cargo test --workspace --locked --no-run --message-format=json > .local/update-release/tests.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = Get-Content .local/update-release/tests.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } | Select-Object -ExpandProperty executable -Unique
          if (-not $testFiles) { throw 'No native test executables were built' }
          foreach ($testFile in $testFiles) {
            $testCopy = Join-Path .local/update-release ([System.IO.Path]::GetFileName($testFile))
            Copy-Item -LiteralPath $testFile -Destination $testCopy
            & $testCopy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm audit --audit-level=moderate
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the existing updater private key in the release environment' }
          node tools/tauri.mjs build --bundles nsis
      - name: Generate update manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node tools/update-manifest.mjs "target/release/bundle/nsis/ServerDeck_$($env:RELEASE_VERSION)_x64-setup.exe" .local/update-release/notes.txt
      - name: Create version tag at the tested commit
        run: node tools/update-release.mjs --create-tag
      - name: Upload complete draft for release acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to replace an already published release' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "ServerDeck $env:RELEASE_TAG" --notes-file .local/update-release/notes.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.sig target/release/bundle/nsis/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
