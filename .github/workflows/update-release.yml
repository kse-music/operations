name: Signed Windows update draft
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (optional; leave blank to generate automatically)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: signed-update-release
  cancel-in-progress: false
jobs:
  windows-update:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - name: Preserve repository LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate stable version and prepare notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node tools/update-release.mjs --prepare
      - name: Prepare Rust and WASM toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
      - name: Cache Rust dependencies and release compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target/release/deps
            target/release/build
            target/release/.fingerprint
            .local/plugin-build/assistant
            .local/plugin-build/docker
          key: signed-windows-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'plugins/system/*/backend/Cargo.toml', 'plugins/system/*/backend/Cargo.lock') }}
          restore-keys: |
            signed-windows-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v1-
      - run: npm ci --no-audit
      - name: Fetch locked Windows workspace dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Fetch locked production WASM plugin dependencies
        run: node tools/build-system-plugins.mjs --fetch-only
      - run: npm audit --audit-level=moderate
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the existing updater private key in the release environment' }
          node tools/tauri.mjs build --bundles nsis
      - name: Generate update manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node tools/update-manifest.mjs "target/release/bundle/nsis/ServerDeck_$($env:RELEASE_VERSION)_x64-setup.exe" .local/update-release/notes.txt
      - name: Create version tag at the built commit
        run: node tools/update-release.mjs --create-tag
      - name: Upload complete draft for release acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to replace an already published release' }
            gh release edit $env:RELEASE_TAG --notes-file .local/update-release/notes.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "ServerDeck $env:RELEASE_TAG" --notes-file .local/update-release/notes.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.sig target/release/bundle/nsis/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
