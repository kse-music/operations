name: Candidate builds (unsigned, no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            config: src-tauri/tauri.conf.json
          - os: macos-latest
            target: aarch64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - os: macos-latest
            target: x86_64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            config: src-tauri/tauri.linux.conf.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Preserve repository LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf xvfb
      - name: Rust stable used by local validation
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.97.1
      - run: rustup target add ${{ matrix.target }}
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Fetch locked Rust workspace dependencies
        run: cargo fetch --locked
      - name: Prepare application version and workspace lockfile
        run: node tools/app-version.mjs
      - run: npm run plugins:fetch
      - name: Generate bundled plugins and test fixture before Rust checks and tests
        run: npm run plugins:build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        if: runner.os != 'Linux'
      - run: npm run test:build
      - run: xvfb-run -a cargo test --workspace --locked
        if: runner.os == 'Linux'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Build unsigned candidate
        run: node tools/tauri.mjs build --target ${{ matrix.target }} --config ${{ matrix.config }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerDeck-system-plugins-${{ matrix.target }}
          path: plugins/system/packages/*.sdplugin
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerDeck-unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14
  rust-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo install cargo-audit --locked
      # Deliberately fails for unresolved advisories: no allowlist that hides the release blocker.
      - run: cargo audit --deny unsound
